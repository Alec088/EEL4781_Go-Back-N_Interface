<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Go-Back-N Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Go-Back-N Protocol Simulator</h1>
  </header>

  <main>
    <section class="controls">
      <label>Window size (N): <input id="winSize" type="number" value="4" min="1" max="10" /></label>
      <label>Seq space (K): <input id="seqK" type="number" value="8" min="2" max="256" /></label>
      <label>Packets to send: <input id="totalPackets" type="number" value="12" min="1"/></label>
      <label>Propagation delay (ms): <input id="delay" type="number" value="500" min="0"/></label>
      <label>Manual data drops (comma list): <input id="dropData" placeholder="e.g. 2,5"/></label>
      <label>Manual ACK drops (comma list): <input id="dropAck" placeholder="e.g. 1,3"/></label>
      <div class="buttons">
        <button id="startBtn">Start</button>
        <button id="stepBtn">Step</button>
        <button id="resetBtn">Reset</button>
      </div>
    </section>

    <section class="visual">
      <div class="panel">
        <h2>Sender Window</h2>
        <div id="senderWindow" class="window"></div>
      </div>
      <div class="panel">
        <h2>Channel</h2>
        <div id="channelArea" class="channel">(packets in flight)</div>
      </div>
      <div class="panel">
        <h2>Receiver</h2>
        <div id="receiverState" class="receiver"></div>
      </div>
    </section>

    <section class="log">
      <h2>Event Log</h2>
      <pre id="logArea"></pre>
      <div class="stats">
        <span id="sentCount">Sent: 0</span>
        <span id="recvCount">Delivered: 0</span>
        <span id="retransCount">Retransmissions: 0</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
